services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: luxxie
      POSTGRES_USER: luxxie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-this-password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxxie -d luxxie"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["sh", "-c", "node dist/database/migrate.js && exec node dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://luxxie:${POSTGRES_PASSWORD:-local-dev-change-this-password}@db:5432/luxxie
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me-to-a-long-random-secret-32chars}
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082}"
      USER_PRECISE_LOCATION_TTL_HOURS: ${USER_PRECISE_LOCATION_TTL_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3011}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_IP_LOCATION_CACHE_HOURS: ${VITE_IP_LOCATION_CACHE_HOURS:-24}
        VITE_ANONYMOUS_PRECISE_LOCATION_CACHE_HOURS: ${VITE_ANONYMOUS_PRECISE_LOCATION_CACHE_HOURS:-24}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:8081}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADVERTISER_HOST_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
